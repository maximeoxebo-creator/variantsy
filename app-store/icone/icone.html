<!doctype html>
<html><head><meta charset="utf-8"><style>
/* Icône Variantsy, 1200 × 1200 — traitement « verre liquide ».
   Une plaque de verre ne se voit que par ce qu'elle DÉFORME : le fond porte
   donc des halos colorés, sans lesquels le flou d'arrière-plan n'aurait rien à
   travailler et les fiches sœurs redeviendraient de simples aplats ternes. */
* { margin:0; padding:0; box-sizing:border-box; }
.icone { position:relative; width:1200px; height:1200px; display:grid; place-items:center; overflow:hidden; }

/* Halos : la matière que le verre va capter. */
.halo { position:absolute; border-radius:50%; filter: blur(96px); }

.scene { position:relative; width:900px; height:900px; display:grid; place-items:center; z-index:2; }

/* --- Fiches sœurs : verre teinté ---------------------------------------- */
.fiche {
  position:absolute; top:150px; width:430px; height:470px;
  border-radius:76px; display:grid; place-items:center;
  backdrop-filter: blur(26px) saturate(180%);
  -webkit-backdrop-filter: blur(26px) saturate(180%);
  box-shadow:
    inset 0 2px 1px rgba(255,255,255,.55),      /* arête éclairée, en haut */
    inset 0 -2px 1px rgba(0,0,0,.18),           /* arête d'ombre, en bas */
    0 40px 90px rgba(0,0,0,.30);
}
.fiche.g { left:0;  transform: rotate(-9deg); }
.fiche.d { right:0; transform: rotate(9deg); }

/* Le reflet spéculaire : c'est lui qui fait lire « verre » plutôt que
   « calque translucide ». */
.fiche::after, .tete::after {
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background: linear-gradient(150deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.06) 34%, transparent 58%);
}

/* --- Fiche de tête : le coloris choisi ---------------------------------- */
.tete {
  position:relative; z-index:3; width:470px; height:470px; border-radius:104px;
  display:grid; place-items:center;
  background: linear-gradient(140deg, rgba(120,150,255,.92) 0%, rgba(130,110,245,.92) 52%, rgba(180,110,245,.92) 100%);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  box-shadow:
    inset 0 3px 2px rgba(255,255,255,.62),
    inset 0 -3px 2px rgba(0,0,0,.20),
    0 44px 110px rgba(70,90,230,.50);
}
svg { display:block; position:relative; z-index:2; }

/* --- Le sélecteur ------------------------------------------------------- */
.rangee { position:absolute; bottom:96px; left:0; right:0; display:flex;
  justify-content:center; align-items:center; gap:44px; z-index:4; }
.pastille {
  width:84px; height:84px; border-radius:50%;
  backdrop-filter: blur(18px) saturate(170%);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  box-shadow: inset 0 2px 1px rgba(255,255,255,.50), inset 0 -2px 1px rgba(0,0,0,.16);
}
.pastille.on {
  background: linear-gradient(140deg, rgba(120,150,255,.95), rgba(180,110,245,.95));
  box-shadow:
    inset 0 2px 1px rgba(255,255,255,.70),
    0 0 0 10px rgba(255,255,255,.10),
    0 0 0 20px rgba(190,190,255,.55);
}
</style></head><body>
<div class="icone" id="cible"></div>
<script>
const TEE = (couleur, taille) => `
<svg width="${taille}" height="${taille}" viewBox="0 0 48 48" fill="none">
  <path d="M17.5 6 L9 10.5 L5.5 20 L12 22.5 L13 18 L13 43 L35 43 L35 18 L36 22.5 L42.5 20 L39 10.5 L30.5 6
           C30.5 11.5 17.5 11.5 17.5 6 Z"
        stroke="${couleur}" stroke-width="3.1" stroke-linejoin="round" fill="none"/>
</svg>`;

// Trois luminosités de fond. Le verre restant translucide, un fond plus clair
// éclaircit AUSSI les fiches sœurs : les deux se règlent d'un seul curseur.
const VARIANTES = {
  A: { fond:"#131A33", halo:.42, voile:.34 },
  B: { fond:"#1C2547", halo:.50, voile:.40 },
  C: { fond:"#2A3568", halo:.58, voile:.46 },
  // Mode clair. Sur fond blanc, une plaque de verre ne se lit plus par son
  // arête éclairée — le fond est déjà lumineux — mais par son OMBRE PORTÉE et
  // par la teinte qu'elle laisse passer. Les réglages s'inversent donc :
  // ombres plus présentes, voile plus dense, halos discrets.
  LA: { fond:"#F2F3F8", halo:.30, voile:.50, clair:true },
  LB: { fond:"#EDEFF6", halo:.38, voile:.56, clair:true },
  LC: { fond:"#E4E7F2", halo:.46, voile:.62, clair:true },
};
const v = VARIANTES[new URLSearchParams(location.search).get("v") || "B"];

const cible = document.getElementById("cible");
cible.style.background = v.fond;

if (v.clair) {
  const style = document.createElement("style");
  style.textContent = `
    .fiche {
      box-shadow:
        inset 0 2px 1px rgba(255,255,255,.85),
        inset 0 -1px 1px rgba(0,0,0,.06),
        0 26px 56px rgba(40,50,90,.20);
    }
    .tete {
      box-shadow:
        inset 0 3px 2px rgba(255,255,255,.75),
        inset 0 -3px 2px rgba(0,0,0,.10),
        0 30px 70px rgba(70,90,230,.34);
    }
    .pastille {
      box-shadow:
        inset 0 2px 1px rgba(255,255,255,.75),
        0 6px 16px rgba(40,50,90,.16);
    }
    .pastille.on {
      box-shadow:
        inset 0 2px 1px rgba(255,255,255,.80),
        0 0 0 10px rgba(255,255,255,.85),
        0 0 0 20px rgba(120,110,240,.55),
        0 6px 18px rgba(40,50,90,.18);
    }
    /* Le reflet doit s'effacer : sur fond clair il blanchissait la plaque. */
    .fiche::after, .tete::after {
      background: linear-gradient(150deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.04) 30%, transparent 52%);
    }`;
  document.head.appendChild(style);
}
cible.innerHTML = `
  <span class="halo" style="width:470px;height:470px;left:110px;top:250px;background:#E4CFA9;opacity:${v.halo}"></span>
  <span class="halo" style="width:470px;height:470px;right:110px;top:250px;background:#D46A4E;opacity:${v.halo}"></span>
  <span class="halo" style="width:560px;height:560px;left:320px;bottom:60px;background:#6E8CFF;opacity:${v.halo * 0.9}"></span>
  <div class="scene">
    <div class="fiche g" style="background:rgba(216,195,165,${v.voile + 0.30})">${TEE(v.clair ? "rgba(90,65,35,.70)" : "rgba(60,40,20,.55)", 210)}</div>
    <div class="fiche d" style="background:rgba(193,97,75,${v.voile + 0.30})">${TEE("rgba(255,240,235,.80)", 210)}</div>
    <div class="tete">${TEE("#FFFFFF", 250)}</div>
    <div class="rangee">
      <span class="pastille" style="background:rgba(216,195,165,.78)"></span>
      <span class="pastille on"></span>
      <span class="pastille" style="background:rgba(193,97,75,.78)"></span>
    </div>
  </div>`;
</script></body></html>
