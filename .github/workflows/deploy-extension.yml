# ---------------------------------------------------------------------------
# Déploie l'extension de thème quand — et seulement quand — un fichier de
# `extensions/` ou `shopify.app.toml` change.
#
# Raison d'être : `git push` déploie l'admin via Vercel mais PAS l'extension
# storefront (piège n°1). Ce workflow supprime l'oubli manuel.
#
# Secrets à créer dans GitHub → Settings → Secrets and variables → Actions :
#   SHOPIFY_CLI_PARTNERS_TOKEN  (Partner Dashboard → CLI token)
#   SHOPIFY_API_KEY             (client_id de l'app)
# ---------------------------------------------------------------------------
name: Deploy theme extension

on:
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "scripts/minify.mjs"
      - "shopify.app.toml"
  workflow_dispatch:

concurrency:
  group: shopify-extension-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @shopify/cli 4.x exige Node >= 22.12. Épingler Node 20 ici pendant
          # que la CLI se mettait à jour toute seule (voir ci-dessous) a fait
          # échouer ce workflow en 44 s, sans que rien n'ait changé dans le repo.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: shopify app deploy
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_CLI_NO_ANALYTICS: "1"
        # --force est obligatoire en CI : sans lui la commande attend une
        # confirmation interactive et le job reste bloqué jusqu'au timeout.
        # La minification doit précéder le déploiement : `assets/` est généré,
        # pas versionné. Sans cette ligne, l'extension partirait sans son JS.
        # La CLI est ÉPINGLÉE. Sans version, `npx shopify` télécharge la
        # dernière publiée : une montée de version majeure arrive alors en
        # production sans qu'aucun commit ne la mentionne, et le jour où elle
        # change ses prérequis, la CI casse sur un repo qui n'a pas bougé.
        # C'est exactement ce qui s'est produit. Monter ce numéro doit être un
        # commit délibéré.
        run: npm run minify && npx @shopify/cli@4.6.1 app deploy --force
